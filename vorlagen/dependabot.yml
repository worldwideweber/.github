# Dependabot nur für die GitHub Actions. Composer-Updates spielt .github/workflows/update.yml ein –
# Dependabot aktualisiert die TYPO3-Core-Pakete einzeln, was nie aufgeht (keine PRs, Lauf trotzdem grün).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
